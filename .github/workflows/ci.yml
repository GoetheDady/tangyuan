name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上的新推送取消仍在跑的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # lint 已通过 eslint-plugin-prettier 覆盖受 eslint 管辖的文件，
      # 这一步补上 md / json / yaml 等 eslint 不处理的类型。
      - name: Format check
        run: bunx prettier --check .
